version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "✅ Cleaning old installs"
        - rm -rf node_modules package-lock.json
        - npm install
        - echo "Installing type declarations"
        - npm install --save-dev @types/bcrypt
        - npm install --save-dev @types/react-google-recaptcha
        - npm install --save-dev @types/jsonwebtoken
        - echo "Running Prisma commands"
        - npx prisma generate --schema=./prisma/schema.prisma
        - npx prisma db push --accept-data-loss --skip-generate
    build:
      commands:
        - echo "✅ Running build with env variables"
        - 'echo "DATABASE_URL starts with: $(echo $DATABASE_URL | cut -c1-40)"'
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
