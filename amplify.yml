version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "✅ Cleaning old installs"
        - rm -rf node_modules package-lock.json
        - npm install
        - echo "Installing type declarations"
        - npm install --save-dev @types/bcrypt
        - npm install --save-dev @types/react-google-recaptcha
        - npm install --save-dev @types/jsonwebtoken
        - echo "✅ Checking environment variables..."
        - 'echo "DATABASE_URL (first 40 chars): $(echo $DATABASE_URL | cut -c1-40)"'
        - 'echo "NEXTAUTH_URL: $NEXTAUTH_URL"'
        - 'echo "NODE_ENV: $NODE_ENV"'
        - 'if [ -z "$DATABASE_URL" ]; then echo "ERROR: DATABASE_URL is not set"; exit 1; fi'
        - 'if [ -z "$NEXTAUTH_SECRET" ]; then echo "WARNING: NEXTAUTH_SECRET is not set"; fi'
    build:
      commands:
        - echo "✅ Generating Prisma Client"
        - npx prisma generate --schema=./prisma/schema.prisma
        - echo "✅ Building Next.js app"
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=0, must-revalidate'
