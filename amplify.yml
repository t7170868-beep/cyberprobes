version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "✅ Cleaning old installs"
        - rm -rf node_modules package-lock.json
        - npm install
        - echo "Installing type declarations"
        - npm install --save-dev @types/bcrypt
        - npm install --save-dev @types/react-google-recaptcha
        - npm install --save-dev @types/jsonwebtoken
        - echo "Running Prisma commands"
        - echo "Checking DATABASE_URL..."
        - 'if [ -z "$DATABASE_URL" ]; then echo "ERROR: DATABASE_URL is not set"; exit 1; fi'
        - 'echo "DATABASE_URL starts with: $(echo $DATABASE_URL | cut -c1-40)"'
        - 'echo "DATABASE_URL length: $(echo -n $DATABASE_URL | wc -c)"'
        - 'echo "DATABASE_URL ends with: $(echo $DATABASE_URL | tail -c 50)"'
        # Explicitly export DATABASE_URL to ensure it's available for Prisma
        - export DATABASE_URL="$DATABASE_URL"
        - npx prisma generate --schema=./prisma/schema.prisma
        # Skip db push during build - schema should already be in sync
        # If schema changes are needed, run manually or use migrations
        - echo "Skipping prisma db push (schema should already be in sync)"
    build:
      commands:
        - echo "✅ Running build with env variables"
        - 'echo "DATABASE_URL starts with: $(echo $DATABASE_URL | cut -c1-40)"'
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
