version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "✅ Cleaning old installs"
        - rm -rf node_modules package-lock.json
        - npm install
        - echo "Installing type declarations"
        - npm install --save-dev @types/bcrypt
        - npm install --save-dev @types/react-google-recaptcha
        - npm install --save-dev @types/jsonwebtoken
        - echo "✅ Setting up environment variables (bypassing SSM)..."
        # Explicitly export all critical variables to ensure they're available
        # This bypasses SSM Parameter Store issues
        - |
          if [ -n "$DATABASE_URL" ]; then
            export DATABASE_URL="$DATABASE_URL"
            echo "✅ DATABASE_URL is set (first 40 chars): $(echo $DATABASE_URL | cut -c1-40)"
          else
            echo "❌ ERROR: DATABASE_URL is not set"
            exit 1
          fi
        - |
          if [ -n "$NEXTAUTH_SECRET" ]; then
            export NEXTAUTH_SECRET="$NEXTAUTH_SECRET"
            echo "✅ NEXTAUTH_SECRET is set"
          else
            echo "⚠️ WARNING: NEXTAUTH_SECRET is not set"
          fi
        - |
          if [ -n "$NEXTAUTH_URL" ]; then
            export NEXTAUTH_URL="$NEXTAUTH_URL"
            echo "✅ NEXTAUTH_URL: $NEXTAUTH_URL"
          else
            echo "⚠️ WARNING: NEXTAUTH_URL is not set"
          fi
        - |
          if [ -n "$JWT_SECRET" ]; then
            export JWT_SECRET="$JWT_SECRET"
            echo "✅ JWT_SECRET is set"
          else
            echo "⚠️ WARNING: JWT_SECRET is not set"
          fi
        - |
          if [ -n "$NEXT_PUBLIC_BASE_URL" ]; then
            export NEXT_PUBLIC_BASE_URL="$NEXT_PUBLIC_BASE_URL"
            echo "✅ NEXT_PUBLIC_BASE_URL: $NEXT_PUBLIC_BASE_URL"
          else
            echo "⚠️ WARNING: NEXT_PUBLIC_BASE_URL is not set"
          fi
        - |
          if [ -n "$NODE_ENV" ]; then
            export NODE_ENV="$NODE_ENV"
            echo "✅ NODE_ENV: $NODE_ENV"
          else
            export NODE_ENV="production"
            echo "✅ NODE_ENV set to default: production"
          fi
        - echo "✅ Environment variables configured (SSM warning can be ignored)"
    build:
      commands:
        - echo "✅ Generating Prisma Client"
        - npx prisma generate --schema=./prisma/schema.prisma
        - echo "✅ Building Next.js app"
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=0, must-revalidate'
