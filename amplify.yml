version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Cleaning old installs"
        - rm -rf node_modules package-lock.json
        - npm install
        - echo "Installing type declarations"
        - npm install --save-dev @types/bcrypt
        - npm install --save-dev @types/react-google-recaptcha
        - npm install --save-dev @types/jsonwebtoken
        - echo "=========================================="
        - echo "NOTE - SSM warning above is EXPECTED"
        - echo "If variables are set in Amplify Console,"
        - echo "they work fine despite SSM warning."
        - echo "=========================================="
        - echo "Setting up environment variables (bypassing SSM)..."
        # Explicitly export all critical variables to ensure they're available
        # This bypasses SSM Parameter Store issues
        # SSM warning is harmless if variables are set in Amplify Console
        - |
          if [ -n "$DATABASE_URL" ]; then
            export DATABASE_URL="$DATABASE_URL"
            echo "SUCCESS - DATABASE_URL is set (first 40 chars) - $(echo $DATABASE_URL | cut -c1-40)"
          else
            echo "ERROR - DATABASE_URL is not set"
            exit 1
          fi
        - |
          if [ -n "$NEXTAUTH_SECRET" ]; then
            export NEXTAUTH_SECRET="$NEXTAUTH_SECRET"
            echo "SUCCESS - NEXTAUTH_SECRET is set"
          else
            echo "WARNING - NEXTAUTH_SECRET is not set"
          fi
        - |
          if [ -n "$NEXTAUTH_URL" ]; then
            export NEXTAUTH_URL="$NEXTAUTH_URL"
            echo "SUCCESS - NEXTAUTH_URL = $NEXTAUTH_URL"
          else
            echo "WARNING - NEXTAUTH_URL is not set"
          fi
        - |
          if [ -n "$JWT_SECRET" ]; then
            export JWT_SECRET="$JWT_SECRET"
            echo "SUCCESS - JWT_SECRET is set"
          else
            echo "WARNING - JWT_SECRET is not set"
          fi
        - |
          if [ -n "$NEXT_PUBLIC_BASE_URL" ]; then
            export NEXT_PUBLIC_BASE_URL="$NEXT_PUBLIC_BASE_URL"
            echo "SUCCESS - NEXT_PUBLIC_BASE_URL = $NEXT_PUBLIC_BASE_URL"
          else
            echo "WARNING - NEXT_PUBLIC_BASE_URL is not set"
          fi
        - |
          if [ -n "$NEXT_PUBLIC_RECAPTCHA_SITE_KEY" ]; then
            export NEXT_PUBLIC_RECAPTCHA_SITE_KEY="$NEXT_PUBLIC_RECAPTCHA_SITE_KEY"
            echo "SUCCESS - NEXT_PUBLIC_RECAPTCHA_SITE_KEY is set (first 20 chars) - $(echo $NEXT_PUBLIC_RECAPTCHA_SITE_KEY | cut -c1-20)"
          else
            echo "WARNING - NEXT_PUBLIC_RECAPTCHA_SITE_KEY is not set"
          fi
        - |
          if [ -n "$NODE_ENV" ]; then
            export NODE_ENV="$NODE_ENV"
            echo "SUCCESS - NODE_ENV = $NODE_ENV"
          else
            export NODE_ENV="production"
            echo "SUCCESS - NODE_ENV set to default production"
          fi
        - echo "SUCCESS - Environment variables configured (SSM warning can be ignored)"
    build:
      commands:
        - echo "Verifying environment variables in build phase..."
        - |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR - DATABASE_URL missing in build phase"
            exit 1
          fi
        - |
          if [ -z "$NEXTAUTH_SECRET" ]; then
            echo "WARNING - NEXTAUTH_SECRET missing in build phase"
          fi
        - |
          if [ -z "$NEXT_PUBLIC_RECAPTCHA_SITE_KEY" ]; then
            echo "WARNING - NEXT_PUBLIC_RECAPTCHA_SITE_KEY missing in build phase"
          else
            echo "SUCCESS - NEXT_PUBLIC_RECAPTCHA_SITE_KEY is available in build phase"
          fi
        - echo "Generating Prisma Client"
        - npx prisma generate --schema=./prisma/schema.prisma
        - echo "Building Next.js app"
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=0, must-revalidate'
