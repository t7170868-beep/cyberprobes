name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, pratik/develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    name: Lint & Type Check
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run ESLint
      run: npm run lint
      continue-on-error: false
    
    - name: Run TypeScript type check
      run: npm run type-check
      continue-on-error: false

  build:
    runs-on: ubuntu-latest
    name: Build Application
    needs: lint-and-typecheck
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Generate Prisma client
      run: npx prisma generate
      env:
        DATABASE_URL: "file:./test.db"
    
    - name: Build Next.js application
      run: npm run build
      env:
        DATABASE_URL: "file:./test.db"
        NEXTAUTH_SECRET: "test-secret-key-for-ci"
        NEXTAUTH_URL: "http://localhost:3000"
        NEXT_PUBLIC_BASE_URL: "http://localhost:3000"
        NODE_ENV: production
    
    - name: Verify build output
      run: |
        if [ ! -d ".next" ]; then
          echo "Build failed: .next directory not found"
          exit 1
        fi
        if [ ! -f ".next/BUILD_ID" ]; then
          echo "Build failed: BUILD_ID not found"
          exit 1
        fi
        echo "Build verification successful"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: build-artifacts
        path: |
          .next/
          node_modules/.prisma/
        retention-days: 1

  security:
    runs-on: ubuntu-latest
    name: Security Audit
    needs: lint-and-typecheck
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run npm audit (moderate and above)
      run: npm audit --audit-level moderate || true
      continue-on-error: true
    
    - name: Run npm audit (high and critical only)
      run: npm audit --audit-level high
      continue-on-error: false

  test:
    runs-on: ubuntu-latest
    name: Test Suite
    needs: [lint-and-typecheck]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Generate Prisma client
      run: npx prisma generate
      env:
        DATABASE_URL: "file:./test.db"
    
    - name: Run tests (if available)
      run: |
        if npm run | grep -q "test"; then
          npm test
        else
          echo "No test script found, skipping tests"
        fi
      continue-on-error: true

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Production
    needs: [build, security, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://cyberprobes.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: .
    
    - name: Deploy to Vercel
      run: |
        if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
          npm install -g vercel
          vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        else
          echo "Vercel token not configured, skipping Vercel deployment"
        fi
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      continue-on-error: true
    
    - name: AWS Amplify Deployment Info
      run: |
        echo "AWS Amplify deployments are typically handled via webhook"
        echo "Configure AWS Amplify webhook in GitHub repository settings"
        echo "Or use AWS Amplify Console for automatic deployments"
      continue-on-error: true
    
    - name: Deployment notification
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment successful"
        else
          echo "⚠️ Deployment step completed (may require manual configuration)"
        fi
